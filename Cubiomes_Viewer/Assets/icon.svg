<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <clipPath id="badge">
    <rect width="256" height="256" rx="44"/>
  </clipPath>
  <g clip-path="url(#badge)">
    <!-- Opaque backing prevents transparent antialiasing seams. -->
    <rect width="256" height="256" fill="#2f8f5b"/>
    <!-- Slight overlaps + crisp edges help across different rasterizers. -->
    <g shape-rendering="crispEdges">
    <rect x="0" y="0" width="68" height="68" fill="#2f8f5b"/>
    <rect x="64" y="0" width="68" height="68" fill="#3aa56b"/>
    <rect x="128" y="0" width="68" height="68" fill="#1d5c8a"/>
    <rect x="192" y="0" width="68" height="68" fill="#2b7fb8"/>
    <rect x="0" y="64" width="68" height="68" fill="#3aa56b"/>
    <rect x="64" y="64" width="68" height="68" fill="#e7d9a0"/>
    <rect x="128" y="64" width="68" height="68" fill="#2b7fb8"/>
    <rect x="192" y="64" width="68" height="68" fill="#1d5c8a"/>
    <rect x="0" y="128" width="68" height="68" fill="#2f8f5b"/>
    <rect x="64" y="128" width="68" height="68" fill="#5fbf7f"/>
    <rect x="128" y="128" width="68" height="68" fill="#e7d9a0"/>
    <rect x="192" y="128" width="68" height="68" fill="#2b7fb8"/>
    <rect x="0" y="192" width="68" height="68" fill="#8a6f4d"/>
    <rect x="64" y="192" width="68" height="68" fill="#2f8f5b"/>
    <rect x="128" y="192" width="68" height="68" fill="#3aa56b"/>
    <rect x="192" y="192" width="68" height="68" fill="#e7d9a0"/>
    </g>
  </g>
</svg>
