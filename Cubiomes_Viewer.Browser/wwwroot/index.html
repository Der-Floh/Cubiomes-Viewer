<!DOCTYPE html>
<html>

<head>
    <title>Cubiomes Viewer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-x256.png" />
    <link rel="stylesheet" href="./app.css" />
</head>

<body style="margin: 0; overflow: hidden">
<div id="out">
    <div class="avalonia-splash">
        <div class="splash-tiles" aria-hidden="true">
            <span style="--color: #2f8f5b; --step: 0"></span>
            <span style="--color: #3aa56b; --step: 1"></span>
            <span style="--color: #1d5c8a; --step: 2"></span>
            <span style="--color: #2b7fb8; --step: 3"></span>
            <span style="--color: #3aa56b; --step: 1"></span>
            <span style="--color: #e7d9a0; --step: 2"></span>
            <span style="--color: #2b7fb8; --step: 3"></span>
            <span style="--color: #1d5c8a; --step: 4"></span>
            <span style="--color: #2f8f5b; --step: 2"></span>
            <span style="--color: #5fbf7f; --step: 3"></span>
            <span style="--color: #e7d9a0; --step: 4"></span>
            <span style="--color: #2b7fb8; --step: 5"></span>
            <span style="--color: #8a6f4d; --step: 3"></span>
            <span style="--color: #2f8f5b; --step: 4"></span>
            <span style="--color: #3aa56b; --step: 5"></span>
            <span style="--color: #e7d9a0; --step: 6"></span>
        </div>
        <h2>Cubiomes Viewer</h2>
        <p>Loading...</p>
    </div>
</div>
<script type='module' src="./main.js"></script>
</body>

</html>
