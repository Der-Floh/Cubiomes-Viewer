name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  PACKAGE_NAME: CubiomesViewer
  DESKTOP_PROJECT: Cubiomes_Viewer.Desktop/Cubiomes_Viewer.Desktop.csproj
  ANDROID_PROJECT: Cubiomes_Viewer.Android/Cubiomes_Viewer.Android.csproj

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Build the native library for glibc 2.28
        if: runner.os == 'Linux'
        run: bash native/build-manylinux.sh

      - name: Test engine
        run: dotnet test Cubiomes_Viewer.Engine.Tests -c Release -clp:ForceConsoleColor

      - name: Test CLI
        run: dotnet test Cubiomes_Viewer.Cli.Tests -c Release -clp:ForceConsoleColor

      - name: Test UI
        if: runner.os == 'Windows'
        run: dotnet test Cubiomes_Viewer.Tests -c Release -clp:ForceConsoleColor

  browser:
    name: Publish web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish Cubiomes_Viewer.Browser -c Release -o publish-output -clp:ForceConsoleColor

      - name: Check the worker was published with the app
        run: test -f publish-output/wwwroot/worker/worker.js

  package:
    name: Package win-x64
    runs-on: windows-latest

    env:
      PREVIEW_VERSION: 0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Publish
        id: publish
        uses: Der-Floh/Der-Floh/.github/actions/dotnet-publish@v1
        with:
          project-path: ${{ env.DESKTOP_PROJECT }}
          runtime: win-x64
          version: ${{ env.PREVIEW_VERSION }}
          publish-profile: release

      - name: Pack
        id: pack
        uses: Der-Floh/Der-Floh/.github/actions/velopack-pack@v1
        with:
          project-path: ${{ env.DESKTOP_PROJECT }}
          publish-dir: ${{ steps.publish.outputs.dir }}
          runtime: win-x64
          version: ${{ env.PREVIEW_VERSION }}
          author: Der_Floh
          package-name: ${{ env.PACKAGE_NAME }}
          splash-image: Cubiomes_Viewer/Assets/icon-x256.png
          output-dir: artifacts

      - name: Verify installer
        uses: Der-Floh/Der-Floh/.github/actions/verify-velopack@v1
        with:
          setup-path: ${{ steps.pack.outputs.setup-path }}
          package-name: ${{ env.PACKAGE_NAME }}
          version: ${{ env.PREVIEW_VERSION }}

  aot:
    name: AOT ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            os: ubuntu-latest
            self-test: true
          - runtime: win-arm64
            os: windows-latest
            self-test: false
          - runtime: osx-arm64
            os: macos-latest
            self-test: true
          - runtime: osx-x64
            os: macos-latest
            self-test: false

    env:
      CLI_PROJECT: Cubiomes_Viewer.Cli/Cubiomes_Viewer.Cli.csproj
      PREVIEW_VERSION: 0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Build the native library for glibc 2.28
        if: matrix.runtime == 'linux-x64'
        run: bash native/build-manylinux.sh

      - name: Publish for glibc 2.28
        if: matrix.runtime == 'linux-x64'
        run: |
          bash native/publish-manylinux.sh "$DESKTOP_PROJECT" "$PREVIEW_VERSION" "$RUNNER_TEMP/aot/app"
          bash native/publish-manylinux.sh "$CLI_PROJECT" "$PREVIEW_VERSION" "$RUNNER_TEMP/aot/cli"

      - name: Publish
        if: matrix.runtime != 'linux-x64'
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          foreach ($project in @{ app = $env:DESKTOP_PROJECT; cli = $env:CLI_PROJECT }.GetEnumerator())
          {
              dotnet publish $project.Value -r $env:RUNTIME -p:PublishProfile=release "-p:Version=$env:PREVIEW_VERSION" "-p:PublishDir=$env:RUNNER_TEMP/aot/$($project.Key)/" -clp:ForceConsoleColor
              if ($LASTEXITCODE -ne 0) { throw "Publishing $($project.Value) for $env:RUNTIME failed with exit code $LASTEXITCODE." }
          }

      - name: Self-test the CLI
        if: matrix.self-test
        run: '"$RUNNER_TEMP/aot/cli/cubiomes-viewer-cli" --selftest'

  android:
    name: Package Android
    runs-on: ubuntu-latest

    env:
      PREVIEW_VERSION: 0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Publish
        id: publish
        uses: Der-Floh/Der-Floh/.github/actions/android-publish@v1
        with:
          project-path: ${{ env.ANDROID_PROJECT }}
          version: ${{ env.PREVIEW_VERSION }}
          apk-path: artifacts/${{ env.PACKAGE_NAME }}-android.apk
          allow-debug-key: true

      - name: Check the APK has the generator for both processors
        env:
          APK_PATH: ${{ steps.publish.outputs.apk-path }}
        run: test "$(unzip -l "$APK_PATH" | grep -cE 'lib/(arm64-v8a|x86_64)/libcvnative\.so$')" -eq 2

  automerge:
    needs: [test, browser, package, aot, android]
    permissions:
      contents: write
      pull-requests: write
    uses: Der-Floh/Der-Floh/.github/workflows/dependabot-automerge.yml@v1
