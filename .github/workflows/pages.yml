name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 1.0.0). Defaults to the latest release tag.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-to-github-pages:
    uses: Der-Floh/Der-Floh/.github/workflows/app-pages.yml@v1
    with:
      project-path: Cubiomes_Viewer.Browser/Cubiomes_Viewer.Browser.csproj
      version: ${{ inputs.version }}
