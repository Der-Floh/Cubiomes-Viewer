name: Publish Release

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  AUTHOR: Der_Floh
  PACKAGE_NAME: CubiomesViewer
  MAC_BUNDLE_ID: io.github.der-floh.cubiomesviewer
  DESKTOP_PROJECT: Cubiomes_Viewer.Desktop/Cubiomes_Viewer.Desktop.csproj
  ANDROID_PROJECT: Cubiomes_Viewer.Android/Cubiomes_Viewer.Android.csproj
  CLI_PROJECT: Cubiomes_Viewer.Cli/Cubiomes_Viewer.Cli.csproj
  CLI_NAME: cubiomes-viewer-cli
  ICON_PNG: Cubiomes_Viewer/Assets/icon-x256.png

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest

    permissions: {}

    outputs:
      value: ${{ steps.version.outputs.value }}

    steps:
      - name: Resolve version
        id: version
        uses: Der-Floh/Der-Floh/.github/actions/resolve-version@v1
        with:
          tag: ${{ github.event.release.tag_name }}

  windows:
    name: Pack ${{ matrix.runtime }}
    needs: version
    runs-on: windows-latest

    strategy:
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Publish
        id: publish
        uses: Der-Floh/Der-Floh/.github/actions/dotnet-publish@v1
        with:
          project-path: ${{ env.DESKTOP_PROJECT }}
          runtime: ${{ matrix.runtime }}
          version: ${{ needs.version.outputs.value }}
          publish-profile: release

      - name: Pack
        uses: Der-Floh/Der-Floh/.github/actions/velopack-pack@v1
        with:
          project-path: ${{ env.DESKTOP_PROJECT }}
          publish-dir: ${{ steps.publish.outputs.dir }}
          runtime: ${{ matrix.runtime }}
          version: ${{ needs.version.outputs.value }}
          author: ${{ env.AUTHOR }}
          package-name: ${{ env.PACKAGE_NAME }}
          splash-image: ${{ env.ICON_PNG }}
          output-dir: artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 3

  verify-windows:
    name: Verify ${{ matrix.runtime }}
    needs: [version, windows]
    runs-on: ${{ endsWith(matrix.runtime, 'arm64') && 'windows-11-arm' || 'windows-latest' }}

    permissions: {}

    strategy:
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts

      - name: Verify installer
        uses: Der-Floh/Der-Floh/.github/actions/verify-velopack@v1
        with:
          setup-path: artifacts/${{ env.PACKAGE_NAME }}-${{ matrix.runtime }}-Setup.exe
          package-name: ${{ env.PACKAGE_NAME }}
          version: ${{ needs.version.outputs.value }}

  linux:
    name: Pack linux-x64
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Build the native library for glibc 2.28
        run: bash native/build-manylinux.sh

      - name: Publish
        id: publish
        uses: Der-Floh/Der-Floh/.github/actions/dotnet-publish@v1
        with:
          project-path: ${{ env.DESKTOP_PROJECT }}
          runtime: linux-x64
          version: ${{ needs.version.outputs.value }}
          publish-profile: release

      - name: Pack
        uses: Der-Floh/Der-Floh/.github/actions/velopack-pack@v1
        with:
          project-path: ${{ env.DESKTOP_PROJECT }}
          publish-dir: ${{ steps.publish.outputs.dir }}
          runtime: linux-x64
          version: ${{ needs.version.outputs.value }}
          author: ${{ env.AUTHOR }}
          package-name: ${{ env.PACKAGE_NAME }}
          icon: ${{ env.ICON_PNG }}
          categories: Utility
          output-dir: artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 3

  macos:
    name: Pack ${{ matrix.runtime }}
    needs: version
    runs-on: macos-latest

    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Publish
        id: publish
        uses: Der-Floh/Der-Floh/.github/actions/dotnet-publish@v1
        with:
          project-path: ${{ env.DESKTOP_PROJECT }}
          runtime: ${{ matrix.runtime }}
          version: ${{ needs.version.outputs.value }}
          publish-profile: release

      - name: Pack
        uses: Der-Floh/Der-Floh/.github/actions/velopack-pack@v1
        with:
          project-path: ${{ env.DESKTOP_PROJECT }}
          publish-dir: ${{ steps.publish.outputs.dir }}
          runtime: ${{ matrix.runtime }}
          version: ${{ needs.version.outputs.value }}
          author: ${{ env.AUTHOR }}
          package-name: ${{ env.PACKAGE_NAME }}
          icon: ${{ env.ICON_PNG }}
          bundle-id: ${{ env.MAC_BUNDLE_ID }}
          output-dir: artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 3

  android:
    name: Pack android
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Publish
        uses: Der-Floh/Der-Floh/.github/actions/android-publish@v1
        with:
          project-path: ${{ env.ANDROID_PROJECT }}
          version: ${{ needs.version.outputs.value }}
          apk-path: artifacts/${{ env.PACKAGE_NAME }}-android.apk
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: artifacts/
          if-no-files-found: error
          retention-days: 3

  cli:
    name: CLI ${{ matrix.runtime }}
    needs: version
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: osx-arm64
            os: macos-latest
          - runtime: osx-x64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: Der-Floh/Der-Floh/.github/actions/setup-dotnet@v1

      - name: Build the native library for glibc 2.28
        if: matrix.runtime == 'linux-x64'
        run: bash native/build-manylinux.sh

      - name: Publish
        id: publish
        uses: Der-Floh/Der-Floh/.github/actions/dotnet-publish@v1
        with:
          project-path: ${{ env.CLI_PROJECT }}
          runtime: ${{ matrix.runtime }}
          version: ${{ needs.version.outputs.value }}
          publish-profile: release

      - name: Zip
        if: runner.os == 'Windows'
        uses: Der-Floh/Der-Floh/.github/actions/zip@v1
        with:
          path: ${{ steps.publish.outputs.dir }}
          archive: artifacts/${{ env.CLI_NAME }}-${{ matrix.runtime }}.zip
          folder-name: ${{ env.CLI_NAME }}

      - name: Tar
        if: runner.os != 'Windows'
        uses: Der-Floh/Der-Floh/.github/actions/tar@v1
        with:
          path: ${{ steps.publish.outputs.dir }}
          archive: artifacts/${{ env.CLI_NAME }}-${{ matrix.runtime }}.tar.gz
          folder-name: ${{ env.CLI_NAME }}

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-cli-${{ matrix.runtime }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 3

  release:
    name: Upload to release
    needs: [verify-windows, linux, macos, android, cli]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # The app only compares its version with the newest release, so vpk's update feed (the full packages and the releases, RELEASES and assets files) stays out.
      - name: Upload to release
        uses: Der-Floh/Der-Floh/.github/actions/github-release-upload@v1
        with:
          files: |
            ./artifacts/${{ env.PACKAGE_NAME }}-*-Setup.exe
            ./artifacts/${{ env.PACKAGE_NAME }}-*-Setup.pkg
            ./artifacts/${{ env.PACKAGE_NAME }}-*-Portable.zip
            ./artifacts/${{ env.PACKAGE_NAME }}-*.AppImage
            ./artifacts/${{ env.PACKAGE_NAME }}-android.apk
            ./artifacts/${{ env.CLI_NAME }}-*

  winget:
    name: WinGet
    needs: release
    if: ${{ !github.event.release.prerelease }}

    permissions:
      contents: read

    uses: Der-Floh/Der-Floh/.github/workflows/app-publish-winget.yml@v1
    with:
      tag: ${{ github.event.release.tag_name }}
      author: Der_Floh
      package-name: CubiomesViewer
      runtimes: '["win-x64", "win-arm64"]'
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
